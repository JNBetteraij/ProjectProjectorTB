<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<script type="importmap">
			{
				"imports": {
					"acorn": "../../node_modules/acorn/dist/acorn.mjs",
					"acorn-walk": "../../node_modules/acorn-walk/dist/walk.mjs"
				}
			}
		</script>
		<script
			type="module"
			src="../javascript/app.js"
		></script>
		<link
			rel="stylesheet"
			href="../css/normalize.css"
		/>
		<link
			rel="stylesheet"
			href="../css/style.css"
		/>
		<title>Project Scope Graph</title>
	</head>
	<body>
		<main class="workspace">
			<aside
				id="scopePanel"
				aria-label="Project files"
			>
				<header class="panel-header">
					<div>
						<h1>Project scopes</h1>
						<p
							id="projectSummary"
							class="muted"
						>
							Choose a project folder to map its imports.
						</p>
					</div>
					<button
						id="openControlsButton"
						type="button"
					>
						Scan settings
					</button>
				</header>
				<div class="panel-actions">
					<button
						id="downloadButton"
						type="button"
						disabled
					>
						Download JSON
					</button>
					<button
						id="copyButton"
						type="button"
						disabled
					>
						Copy JSON
					</button>
				</div>
				<div
					id="status"
					role="status"
					aria-live="polite"
				>
					Choose a project folder to begin.
				</div>
				<div
					id="scopeList"
					class="scope-list"
					aria-live="polite"
				></div>
			</aside>

			<section
				class="graph-area"
				aria-label="Project graph views"
			>
				<div class="graph-toolbar">
					<button
						id="showImportGraphButton"
						type="button"
						aria-pressed="true"
					>
						Import graph
					</button>
					<button
						id="showClassGraphButton"
						type="button"
						aria-pressed="false"
					>
						Class graph
					</button>
					<span
						id="graphInstructions"
						class="muted"
					>
						Drag canvas to pan · Wheel to zoom · Use a node handle to move it
					</span>
					<button
						id="fitGraphButton"
						type="button"
						disabled
					>
						Fit graph
					</button>
				</div>
				<div id="graphViews" class="graph-views"></div>
			</section>
		</main>

		<dialog
			id="controlsDialog"
			aria-labelledby="controlsTitle"
		>
			<form
				id="scanForm"
				class="controls"
				method="dialog"
			>
				<div class="dialog-header">
					<div>
						<h2 id="controlsTitle">Scan project</h2>
						<p class="muted">Map JavaScript files and their import relationships.</p>
					</div>
					<button
						id="closeControlsButton"
						type="button"
						aria-label="Close scan settings"
					>
						Close
					</button>
				</div>
				<label>
					Project folder
					<input
						id="folderInput"
						type="file"
						webkitdirectory
						directory
						multiple
						required
					/>
				</label>
				<div class="toolbar">
					<button
						id="scanButton"
						type="submit"
					>
						Scan project
					</button>
				</div>
				<p class="muted">* Files are read and analyzed locally in the browser.</p>
				<p>Options</p>
				<hr width="100%" />
				<label>
					Excluded folders (full path, comma-separated)
					<input
						id="excludedFoldersInput"
						type="text"
						placeholder=""
						value="public/javascript/solvers/"
					/>
				</label>
			</form>
		</dialog>
	</body>
</html>
